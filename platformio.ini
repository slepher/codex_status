; Single build: pioarduino (Arduino core 3.x / IDF 5.x) with a custom sdkconfig
; that enables the power-management core: automatic light sleep in LIVE.
; The stock espressif32 env was retired after the PM build was verified
; (rollback stays available as the 0.10.3 OTA image).
[env:esp32-s3-epaper-154g]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 921600
monitor_speed = 115200
board_build.flash_size = 8MB
; This board's GD25Q64 reads its JEDEC ID wrong and fails page programs at
; 80 MHz (ID 0B20E4 / writes time out); 40 MHz works and detects GD25Q64.
; tools/bootloader_40m_fix.py supplies the missing 40m prebuilt bootloader.
board_build.f_flash = 40000000L
board_build.arduino.memory_type = qio_opi
extra_scripts = pre:tools/bootloader_40m_fix.py
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
; Pin tool-scons to the same build PlatformIO core uses (4.11.1 tarball).
; Otherwise the platform installs its registry copy (4.8.1), core reinstalls
; 4.11.1 mid-build and the uninstall/install churn breaks the running SCons
; process (ModuleNotFoundError: No module named 'SCons.Tool.FortranCommon').
platform_packages =
  platformio/tool-scons@https://github.com/pioarduino/scons/releases/download/4.11.1/scons-local-4.11.1.tar.gz
lib_deps =
  h2zero/NimBLE-Arduino@^2.5.1
  bblanchon/ArduinoJson@^7.0.4
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
  -DCODEX_PM=1
  -DCODEX_NIMBLE_V2=1
custom_sdkconfig =
  CONFIG_PM_ENABLE=y
  CONFIG_FREERTOS_USE_TICKLESS_IDLE=y
  CONFIG_FREERTOS_HZ=1000
  CONFIG_PM_DFS_INIT_AUTO=y
  CONFIG_PM_POWER_DOWN_CPU_IN_LIGHT_SLEEP=y
  CONFIG_PM_RESTORE_CACHE_TAGMEM_AFTER_LIGHT_SLEEP=y
  CONFIG_PM_SLP_IRAM_OPT=y
  CONFIG_PM_RTOS_IDLE_OPT=y
  CONFIG_PM_SLP_DISABLE_GPIO=y
  CONFIG_USJ_NO_AUTO_LS_ON_CONNECTION=y
  CONFIG_ESP_WIFI_SLP_IRAM_OPT=y
  CONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192
