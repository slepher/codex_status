name: release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  firmware:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - target: note4
            env: zectrix-note4-b
          - target: 154g
            env: esp32-s3-epaper-154g
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install platformio
      - name: Bootstrap only this target's packages
        run: pio pkg install -e ${{ matrix.env }}
      - name: Build isolated target
        shell: pwsh
        run: ./tools/pio-target.ps1 -Target ${{ matrix.target }}
      - name: Verify marker, slot budget, and stage ROM
        run: python tools/stage-release-rom.py --env ${{ matrix.env }} --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
      - name: Report missing ROM explicitly
        if: failure()
        shell: pwsh
        run: '"ROM release gap: ${{ matrix.env }} failed. Do not substitute another target or publish a complete release. See backlog C6." >> $env:GITHUB_STEP_SUMMARY'
  bridge:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bblanchon/ArduinoJson
          ref: v7.4.3
          path: dependencies/ArduinoJson
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridge
      - name: Use host-only ArduinoJson headers
        shell: bash
        run: echo "CODEX_STATUS_ARDUINOJSON=$GITHUB_WORKSPACE/dependencies/ArduinoJson/src" >> "$GITHUB_ENV"
      - name: Check font generator and ROM staging guards
        run: |
          python tools/test-unicode-font.py
          python tools/test-release-rom.py
      - name: Test shared core, renderer and app
        working-directory: bridge
        run: cargo test --locked -p bridge-core -p bridge-render -p bridge-app
      - name: Build Windows release
        if: runner.os == 'Windows'
        working-directory: bridge
        run: cargo build --locked -p bridge-app --release
      - name: Package Windows portable app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/bundle/seed | Out-Null
          Copy-Item bridge/target/release/bridge-app.exe dist/bundle/
          Copy-Item tools/test-bridge/templates dist/bundle/seed/templates -Recurse
          Copy-Item LICENSE, README.md dist/bundle/
          Compress-Archive -Path dist/bundle/* -DestinationPath dist/codex-status-bridge-windows-x64.zip
          Get-FileHash dist/*.zip -Algorithm SHA256 | Format-Table -AutoSize
      - name: Build and package macOS app (ad-hoc signed, not notarized)
        if: runner.os == 'macOS'
        shell: bash
        env:
          CODEX_STATUS_BUILD_PROFILE: release
          CODEX_STATUS_APP_OUTPUT: ${{ github.workspace }}/dist/Codex Status Bridge.app
        run: |
          bash tools/build-bridge-macos.sh
          codesign --verify --deep --strict "$CODEX_STATUS_APP_OUTPUT"
          ditto -c -k --sequesterRsrc --keepParent "$CODEX_STATUS_APP_OUTPUT" "dist/codex-status-bridge-${{ matrix.platform }}.zip"
          shasum -a 256 dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error
  release:
    # Manual runs produce artifacts only. Every platform/ROM must succeed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [firmware, bridge]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Hash all release assets
        working-directory: dist
        run: sha256sum *.bin *.json *.zip > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          draft: true
          generate_release_notes: true
