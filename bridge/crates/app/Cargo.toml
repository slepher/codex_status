[package]
name = "bridge-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Codex Status bridge app: Wi-Fi HTTP + BLE pusher in a Tauri v2 tray process"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bridge-core = { path = "../core" }
bridge-ble = { path = "../ble" }
bridge-render = { path = "../render" }
bridge-mcp = { path = "../mcp" }
axum = "0.8"
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-single-instance = "2"
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_SystemInformation"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
