[package]
name = "device-sim"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "device-sim"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
bridge-render = { path = "../render" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
