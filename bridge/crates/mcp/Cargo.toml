[package]
name = "bridge-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP stdio server exposing template authoring tools backed by the firmware engine"

[dependencies]
bridge-core = { path = "../core" }
bridge-ble = { path = "../ble" }
bridge-render = { path = "../render" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
base64 = "0.22"
windows-sys = { version = "0.60", features = ["Win32_System_SystemInformation"] }
