[package]
name = "bridge-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Host build of the firmware template engine for pixel-accurate previews"

[dependencies]
anyhow = "1"
png = "0.17"
serde_json = "1"
miniz_oxide = "0.8"
crc32fast = "1"

[build-dependencies]
cc = "1"

[dev-dependencies]
bridge-core = { path = "../core" }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
sha2 = "0.10"
