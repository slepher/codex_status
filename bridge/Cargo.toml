[workspace]
resolver = "2"
members = ["crates/core", "crates/ble", "crates/app", "crates/render", "crates/mcp", "crates/device-sim"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[patch.crates-io]
# macOS: complete close/state replies after a native remote disconnect.
btleplug = { path = "vendor/btleplug" }

[profile.release]
lto = "thin"
strip = true
